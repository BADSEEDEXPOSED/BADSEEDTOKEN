<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Blockchain Background</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://esm.sh/three@0.160.0",
                "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    <script type="module" src="js/main.js"></script>

<style id="badseed-cursor-relay-style">@media (pointer: fine) { html, body, canvas, * { cursor: none !important; } }</style>
<script id="badseed-cursor-relay">
(function () {
  if (window.parent === window) return;
  window.addEventListener('mousemove', function (e) {
    window.parent.postMessage({ type: 'badseed-cursor', x: e.clientX, y: e.clientY }, '*');
  }, { passive: true });
})();
</script>
</body>
</html>
