[build]
  command = "npm run build"
  publish = "dist"
  functions = "functions"

[[edge_functions]]
  path = "/.netlify/functions/log-visitor"
  function = "log-visitor"

[[edge_functions]]
  path = "/.netlify/functions/view-logs"
  function = "view-logs"

[functions]
  node_bundler = "esbuild"

[functions.amm-poller]
  schedule = "*/1 * * * *"

[functions.fee-worker]
  schedule = "*/5 * * * *"

[functions.guardian]
  schedule = "10 0,18 * * *"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Content-Type = "video/mp4"
    Cache-Control = "public, max-age=31536000, immutable"
