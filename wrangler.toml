name = "badseed-token"
main = "worker.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "single-page-application"
run_worker_first = ["/.netlify/*"]

[[routes]]
pattern = "sow.badseed.exposed"
custom_domain = true

[[routes]]
pattern = "token.badseed.exposed"
custom_domain = true
